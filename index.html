<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המגדל לעזי הנפש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: גותי, שקט, מאיים; משפטים קצרים כמו בספר "בחר את ההרפתקה"
   IDEA: ספר משחק מודפס – עמודים ממוספרים, "עבור לעמוד", דף דמות בשוליים
   PICTURE: ציור המגדל מן ההרפתקה, בדיו חיוורת על כריכה שחורה
   COLOUR and TYPE: לילה – שחור־חום, קלף עמום, ענבר כהה וזהב עכור; פרנק ריהל לכותרות, דוד ליברה לגוף
   LAYOUT: עמוד אחד במרכז, דף הדמות לצדו; בטלפון – הדמות מעל, מתקפלת */
:root{color-scheme:dark;--bg:#0d0a06;--bg2:#17110a;--paper:#ddd3bf;--paper2:#cdc0a6;--ink:#1c160d;--dim:#5e5241;--blood:#8a5208;--blood2:#b8730c;--silver:#a8946b;--line:#a8987a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:radial-gradient(ellipse at 50% 0,#2a1d0c 0,var(--bg) 60%) fixed,var(--bg);color:var(--paper);font:17px/1.6 "David Libre","Frank Ruhl Libre",serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,34px) max(4vw,12px) 60px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:26px;align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
/* ---- the page ---- */
.page{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:3px;
  padding:clamp(46px,5vw,58px) clamp(22px,5vw,64px) 70px;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 80px rgba(90,62,20,.22);min-height:560px;max-width:780px;margin-inline:auto;width:100%}
.page::before{content:"";position:absolute;inset:10px;border:1px solid rgba(70,50,20,.28);pointer-events:none}
.pno{position:absolute;top:18px;left:26px;font:700 14px "Frank Ruhl Libre",serif;color:var(--blood);letter-spacing:.5px}
.foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font:700 15px "Frank Ruhl Libre",serif;color:var(--dim)}
h1,h2{font-family:"Frank Ruhl Libre",serif;font-weight:900;line-height:1.08;margin:0 0 14px;text-wrap:balance}
h2{font-size:clamp(26px,4vw,36px);color:var(--ink)}
.txt p{margin:0 0 12px}
.quote{border-inline-start:3px solid var(--blood);padding:2px 14px;margin:12px 0;font-style:italic;color:#3b2f1c}
.roll{font-size:19px;line-height:1.5;color:#3b3020;background:rgba(255,255,255,.3);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 12px;margin:0 0 18px}
.roll b{font-size:1.25em}
.roll b{color:var(--ink)}.roll .ok{color:#3c5a1a;font-weight:700}.roll .bad{color:var(--blood2);font-weight:700}
.choices{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:8px}
.choices button{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:rgba(255,255,255,.28);border:1px solid rgba(70,50,20,.35);padding:10px 14px;min-height:46px;border-radius:2px;color:var(--ink);transition:background .15s,transform .15s}
.choices button:hover,.choices button:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.choices button:hover .go,.choices button:focus-visible .go{color:#f0b84a}
.choices .go{margin-inline-start:auto;font:700 14px "Frank Ruhl Libre",serif;color:var(--blood);white-space:nowrap}
.choices .t{font-size:13px;color:var(--dim);display:block}
.choices button:hover .t{color:#d6c8a8}
.luck{margin-top:10px;background:transparent;border:1px dashed var(--blood);color:var(--blood);padding:6px 12px;border-radius:2px}
/* ---- cover ---- */
.cover{background:#0a0805;color:var(--paper);text-align:center;padding:clamp(24px,4vw,46px) clamp(18px,4vw,50px) 40px;box-shadow:0 30px 70px rgba(0,0,0,.75);border:1px solid #33270f}
.cover::before{border-color:rgba(220,170,80,.2)}
.cover h1{font-size:clamp(40px,7vw,64px);color:#efc46a;margin:6px 0 4px;letter-spacing:.5px}
.cover .sub{color:var(--silver);margin:0 0 6px}
.cover img{display:block;margin:6px auto 4px;width:auto;max-width:min(78%,430px);height:min(52vh,520px);object-fit:contain;filter:invert(.88) sepia(.75) saturate(1.6) hue-rotate(-8deg);opacity:.9}
.cover .by{font-size:14px;color:#8d7d5c;margin:0 0 18px}
.big{display:inline-block;background:var(--blood);color:#fff3dc;border:0;padding:13px 30px;font:700 19px "Frank Ruhl Libre",serif;min-height:48px;border-radius:2px;margin:4px}
.big:hover,.big:focus-visible{background:var(--blood2);outline:2px solid #efc46a;outline-offset:2px}
.big.alt{background:transparent;border:1px solid #6e5a35;color:#e2d3b2}
/* ---- character creation ---- */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
.cls{background:rgba(255,255,255,.3);border:1px solid rgba(70,50,20,.35);padding:12px;text-align:start;border-radius:2px;color:var(--ink)}
.cls b{font:900 20px "Frank Ruhl Libre",serif;display:block}
.cls small{display:block;color:var(--dim);font-size:14px;line-height:1.4}
.cls[aria-pressed=true]{background:var(--ink);color:var(--paper)}.cls[aria-pressed=true] small{color:#d6c8a8}
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:8px 0}
.abil div{border:1px solid rgba(70,50,20,.35);text-align:center;padding:6px 2px;background:rgba(255,255,255,.25)}
.abil span{display:block;font-size:13px;color:var(--dim)}.abil b{font:900 24px "Frank Ruhl Libre",serif}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.row label{display:flex;gap:6px;align-items:center}
input[type=text]{font:inherit;font-size:17px;padding:8px 10px;border:1px solid #7d6a4a;background:#efe7d6;color:var(--ink);border-radius:2px;min-height:44px}
.seg button{border:1px solid rgba(70,50,20,.45);background:transparent;padding:8px 14px;min-height:44px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
/* ---- combat ---- */
.fight{border:2px solid var(--ink);padding:12px 14px;margin:14px 0 0;background:rgba(255,255,255,.22)}
.foe{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 10px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:2px;cursor:pointer}
.foe[aria-selected=true]{border-color:var(--blood);background:rgba(184,115,12,.1)}
.foe.out{opacity:.4;cursor:default;text-decoration:line-through}
.foe small{color:var(--dim)}
.hp{height:7px;background:#bfb196;border-radius:4px;overflow:hidden}.hp i{display:block;height:100%;background:var(--blood)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.acts button{background:var(--ink);color:var(--paper);border:0;padding:9px 14px;min-height:44px;border-radius:2px}
.acts button.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.acts button:hover{background:var(--blood)}
.flog{font-size:17.5px;max-height:240px;overflow:auto;border-top:1px dashed var(--line);padding-top:6px;margin:0;list-style:none}
.flog li{padding:1px 0}.flog li:first-child{font-weight:700;color:var(--ink)}
.flog li.hit{color:var(--blood2)}
/* ---- sheet ---- */
.sheet{position:sticky;top:16px;background:var(--bg2);border:1px solid #3d2f17;padding:16px 16px 18px;border-radius:3px;font-size:15.5px}
.sheet h3{font:900 22px "Frank Ruhl Libre",serif;margin:0;color:#efc46a}
.sheet .who{color:var(--silver);margin:0 0 10px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid #30250f;padding:4px 0}
.stat span:first-child{color:#a8977a}
.bar{height:8px;background:#3a2d16;border-radius:4px;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%;background:var(--blood2);transition:width .4s}
.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #d9a443;margin-inline-start:3px}.dots i.on{background:#d9a443}
.sheet ul{margin:6px 0 0;padding-inline-start:18px;color:#e0d2b4}
.sheet .tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.sheet .tools button{background:transparent;border:1px solid #5a4723;color:#d6c39a;padding:6px 10px;border-radius:2px;min-height:40px}
.flash{animation:fl .6s}@keyframes fl{0%{background:var(--blood2)}100%{background:transparent}}
.dieanim{display:inline-block;animation:spin .45s ease-out}@keyframes spin{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.sheet{position:static;order:-1}.sheet.fold ul,.sheet.fold .tools,.sheet.fold .more{display:none}}
@media(max-width:600px){.abil{grid-template-columns:repeat(3,minmax(0,1fr))}.foe{grid-template-columns:minmax(0,1fr) 80px}body{font-size:16.5px}}
</style>
</head>
<body>
<div class="wrap solo" id="wrap">
  <main id="main"></main>
  <aside class="sheet" id="sheet" hidden></aside>
</div>
<script>
{
/* ================= כלים ================= */
const $=id=>document.getElementById(id);
const d=n=>1+Math.floor(Math.random()*n);
const R=(n,s,p=0)=>{let t=p;for(let i=0;i<n;i++)t+=d(s);return t;};
const mod=v=>v<=3?-3:v<=5?-2:v<=8?-1:v<=12?0:v<=15?1:v<=17?2:3;
const sg=n=>n>0?'+'+n:n<0?'−'+(-n):'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null; // מצב המשחק
const g=t=>String(t).replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(m,a,b)=>S&&S.h&&S.h.g==='f'?b:a);
const KEY='tower-brave-1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}

/* ================= מקצועות ================= */
const CL={
 fighter:{n:'לוחם',nf:'לוחמת',hd:8,ac:14,sh:1,w:'חרב ארוכה',dmg:8,sv:[12,13,14,15,16],blurb:'שריון שרשראות ומגן, חרב ארוכה. הרבה נקודות פגיעה.'},
 cleric:{n:'כוהן',nf:'כוהנת',hd:6,ac:14,sh:1,w:'אלה',dmg:6,sv:[11,12,14,16,15],blurb:'שרשראות ומגן, אלה. מגרש{|ת} אל־מתים, ומרפא{|ת} פצעים פעם בין מנוחה למנוחה.'},
 mu:{n:'קוסם',nf:'קוסמת',hd:4,ac:10,sh:0,w:'פגיון',dmg:4,sv:[13,14,13,16,15],blurb:'בלי שריון, פגיון. ארבעה לחשים בין מנוחה למנוחה, ולחש חוזר אחרי כל ניצחון.'},
 thief:{n:'גנב',nf:'גנבת',hd:4,ac:12,sh:0,w:'חרב קצרה',dmg:6,sv:[13,14,13,16,15],blurb:'שריון עור. מתגנב{|ת}, מטפס{|ת}, פותח{|ת} מנעולים. נבלע{|ת} בצללים באמצע קרב ודוקר{|ת} בגב.'}};
const SVN=['מוות או רעל','שרביט קסם','שיתוק או התאבנות','נשיפת דרקון','לחש'];
const THIEF={locks:15,traps:10,remove:10,climb:87,silent:20,hide:10,hear:30};
const THIEF2={locks:20,traps:15,remove:15,climb:88,silent:25,hide:15,hear:35};
const LVL={fighter:2,cleric:2,mu:2,thief:2};
const NEXT={fighter:[2000,4000],cleric:[1500,3000],mu:[2500,5000],thief:[1200,2400]};
const DIFF={story:'סיפור',classic:'קלאסי',hard:'קשוח'};
const SKN={locks:'פתיחת מנעולים',traps:'מציאת מלכודות',remove:'פירוק מלכודות',climb:'טיפוס',silent:'תנועה בדממה',hide:'הסתתרות',hear:'שמיעה'};
const SPELLS={sleep:'שינה',missile:'קליע קסם',shield:'מגן',light:'אור'};
const AB=[['str','כוח'],['int','תבונה'],['wis','חוכמה'],['dex','זריזות'],['con','חוסן'],['cha','כריזמה']];
const EXTRA={rope:'חבל וקרס טיפוס',holy:'צלוחית מים קדושים',oil:'שתי צלוחיות שמן',hammer:'פטיש ויתדות ברזל'};

/* ================= מפלצות ================= */
const MON={
 goblin:()=>({n:'גובלין',hp:Math.max(1,R(1,8,-1)),ac:13,atk:0,dmg:[1,6],ml:7,hd:1,xp:5}),
 topash:()=>({n:'טופאש ההובגובלין',hp:Math.max(5,R(1,8,1)),ac:13,atk:1,dmg:[1,8],ml:8,hd:1,xp:15}),
 dog:()=>({n:'רקאק, הכלב',hp:Math.max(3,R(1,8)),ac:12,atk:0,dmg:[1,6],ml:7,hd:1,xp:10}),
 skel:()=>({n:'שלד שומר',hp:Math.max(3,R(1,8)),ac:15,atk:0,dmg:[1,8],ml:12,hd:2,und:1,xp:10}),
 zombie:()=>({n:'זומבי',hp:R(2,8),ac:11,atk:1,dmg:[1,8],ml:12,hd:2,und:1,xp:20}),
 wight:()=>({n:'רנאגאיסה, הנקזן',hp:Math.max(12,R(3,8)),ac:14,atk:2,dmg:[0,0],ml:12,hd:3,und:1,drain:1,magic:1,xp:50}),
 fisher:()=>({n:'דייג המערות',hp:R(3,8),ac:15,atk:2,dmg:[2,4],ml:9,hd:3,xp:50}),
 centi:()=>({n:'נדל ענק',hp:d(4),ac:10,atk:0,dmg:[1,2],ml:7,hd:1,poison:1,xp:6}),
 fly:()=>({n:'זבוב שודד',hp:R(2,8),ac:13,atk:1,dmg:[1,8],ml:8,hd:2,xp:20}),
 rat:()=>({n:'עכברוש ענק',hp:d(4),ac:12,atk:0,dmg:[1,3],ml:8,hd:1,xp:5}),
 stirge:()=>({n:'סטירג׳ מן התהום',hp:R(1,8),ac:12,atk:2,dmg:[1,3],ml:9,hd:1,xp:13}),
 crawler:()=>({n:'זוחל אשפה',hp:R(3,8,1),ac:12,atk:2,dmg:[1,4],ml:9,hd:3,para:1,xp:75}),
 widow:()=>({n:'אלמנה שחורה ענקית',hp:R(3,8),ac:13,atk:1,dmg:[1,6],ml:8,hd:3,poison:1,xp:50}),
 worm:()=>({n:'תולעת אדומה',hp:R(1,8),ac:11,atk:0,dmg:[1,4],ml:7,hd:1,xp:10})};
const WANDER={1:[['centi','centi'],['fly'],['rat','rat'],['stirge']],2:[['crawler'],['centi','centi'],['widow'],['worm']]};

/* ================= גיבור ================= */
function newHero(cls,abil,name,gnd,extra,spell,diff){
 const c=CL[cls],h={cls,name:name||(gnd==='f'?'אלינור':'אלדריק'),g:gnd,ab:abil};
 h.diff=diff||'classic'; h.lvl=h.diff==='hard'?1:LVL[cls];
 const cm=mod(abil.con)*h.lvl;
 const hd=(h.diff!=='hard'&&cls!=='mu')?Math.max(6,c.hd):c.hd; /* גיבור יחיד: לפחות ק6, חוץ מקוסם */
 h.max=h.diff==='hard'?Math.max(2,c.hd+cm):Math.max(8,hd*2+4+(h.lvl-1)*hd+cm); if(h.diff==='story')h.max=Math.ceil(h.max*1.5); h.hp=h.max;
 h.luck=Math.max(1,3+mod(abil.cha)+(h.diff==='story'?2:0)); h.silver=20; h.gold=0; h.xp=0;
 h.items={torch:6,potion:2}; h.items[extra]=extra==='oil'?2:1; if(cls==='thief')h.items.tools=1;
 h.spells=cls==='mu'?(h.diff==='hard'?['sleep','missile']:['sleep','missile','shield']):[]; h.slots=slotsMax(h); h.zap=0; h.brooch=0;
 h.cure=(cls==='cleric'&&h.lvl>=2)?1:0;
 h.f={}; h.floor=1; h.treasure=[];
 return h;
}
function slotsMax(h){return h.cls!=='mu'?0:h.diff==='hard'?1:h.lvl>=2?4:2;}
function AC(h){const c=CL[h.cls];let a=c.ac+c.sh+mod(h.ab.dex)+(h.cls==='thief'&&h.diff!=='hard'?1:0);if(h.f.corroded)a--;if(h.items.ring)a++;if(h.items.cloak)a++;if(h.f.curse)a-=2;return a;}
function weapon(h,vsMagic){ // הנשק הטוב ביותר. נגד מי שנפגע רק מקסם – הפגיון הקסום
 const c=CL[h.cls];
 if(h.items.ldagger&&(vsMagic||c.dmg<=6))return {n:'פגיון הברקים',die:4,plus:1,hit:1,magic:1};
 return {n:c.w,die:c.dmg,plus:0,hit:0,magic:0};
}
function clsName(h){return h.g==='f'?CL[h.cls].nf:CL[h.cls].n;}
function gain(x){S.h.xp+=x;}

/* ================= בדיקות ================= */
function test(t,h){
 const r={};
 if(t.k==='save'){const need=CL[h.cls].sv[t.i]+(t.mod||0),v=d(20);r.ok=v>=need;r.txt='הצלה מפני '+SVN[t.i]+': ק20 = <b>'+v+'</b> (צריך '+need+'+)';}
 else if(t.k==='skill'){const p=h.cls==='thief'?(h.lvl>=2?THIEF2:THIEF)[t.s]+(h.diff==='story'?10:0):(t.alt||0),v=d(100);r.ok=v<=p;r.txt=SKN[t.s]+': ק100 = <b>'+v+'</b> (צריך '+p+' או פחות)';}
 else if(t.k==='d6'){const n=t.n+(t.thief&&h.cls==='thief'?1:0),v=d(6);r.ok=v<=n;r.txt=(t.l||'ק6')+': <b>'+v+'</b> (צריך '+n+' או פחות)';}
 else if(t.k==='ab'){const a=h.ab[t.a]+(t.mod||0),v=d(20);r.ok=v<=a;r.txt='בדיקת '+AB.find(x=>x[0]===t.a)[1]+': ק20 = <b>'+v+'</b> (צריך '+a+' או פחות)';}
 else if(t.k==='atk'){const b=mod(h.ab.dex),v=d(20);r.ok=v+b>=t.ac;r.txt='זריקה: ק20 = <b>'+v+'</b>'+(b?' '+sg(b):'')+' מול דרג״ש '+t.ac;}
 else if(t.k==='pct'){const v=d(100);r.ok=v>t.p;r.txt='ק100 = <b>'+v+'</b> ('+t.p+'% לכישלון)';}
 else if(t.k==='react'){const b=mod(h.ab.cha),v=R(2,6)+b;r.ok=v>=(t.n||9);r.txt='תגובה: 2ק6'+(b?' '+sg(b):'')+' = <b>'+v+'</b> (צריך '+(t.n||9)+'+)';}
 if(S&&S.god&&!r.ok){r.ok=true;r.txt+=' ✦';}
 r.txt+=' — '+(r.ok?'<span class="ok">הצלחה</span>':'<span class="bad">כישלון</span>');
 return r;
}

/* ================= העמודים ================= */
const has=k=>!!(S.h.items[k]);
const F=k=>!!S.h.f[k];
const N={
intro:{t:()=>`<p>המגדל הישן שבגבעה ניצב הרוס כבר עשרות שנים. לשם מה הוקם ומדוע הגיע למצב חורבה – אין אדם חי שזוכר. כמו צלקת ישנה הוא מלווה את נוף הכפר.</p>
<p>יש האומרים שנעזבו בו אוצרות. יש הטוענים שהיה שייך לקוסם, ומוטב להתרחק ממנו כמו מאש. ויש הנשבעים שמפלצות משוטטות בו בשעות הליל.</p>
<p>השמועות חולפות וחוזרות. המגדל נשאר: עיקש, חבוט, מחכה.</p>`,c:[{t:'לחגור את הנשק',go:'create'}]},
village:{t:()=>`<p>זקנת הכפר ממתינה ליד הבאר. היא מניחה בידך שתי צלוחיות זכוכית קטנות.</p><div class="quote">“שני שיקויי ריפוי. אל ת{שתה|שתי} אותם לפני שבאמת ת{צטרך|צטרכי} להם. והמגדל, {בני|בתי} – הוא לא שוכח את מי שנכנס אליו.”</div><p>השמש שוקעת מאחורי הגבעה. העשבייה לוחשת ברוח הסתיו.</p>`,
 c:[{t:'לעלות עכשיו, בדמדומים',go:'hill',fx:h=>{h.f.night=1;},sub:'בלילה המשוטטים רעבים יותר'},{t:'לחכות לבוקר',go:'hill'}]},
hill:{t:()=>`<p>${F('night')?'הירח מטיל צללים ארוכים':'אור בוקר אפור נופל'} על אבנים גדולות ושבורות, מכוסות טחב. הקומות העליונות קרסו מזמן. רק קומת הקרקע עוד עומדת, ובאחד מחדריה יורדות מדרגות אבן סדוקות אל מתחת לאדמה.</p>`,
 c:[{t:'לחפש עקבות לפני הירידה',test:{k:'ab',a:'wis'},ok:'tracks',no:'stairs',nomsg:'האדמה קשה. לא מצאת דבר.'},{t:'לרדת במדרגות',go:'stairs'}]},
tracks:{t:()=>`<p>עשרות עקבות של רגליים קטנות ויחפות. ביניהן טביעות של מגפיים כבדים – של מישהו גדול יותר. וגם עקבות של כלב.</p><p>גובלינים. ומישהו שהגובלינים מפחדים ממנו.</p>`,c:[{t:'לרדת במדרגות',go:'stairs'}]},
stairs:{t:()=>`<p>המדרגות, רוחבן מטר וחצי, יורדות כחמישה מטרים אל האפלה בפניות חדות. אור היום לא מגיע לכאן. את{ה|} מדליק{|ה} לפיד.</p><p>מלמטה – קולות צרודים, צחוק, נקישת קוביות על עץ.</p>`,
 c:[{t:'לרדת בדממה',test:{k:'skill',s:'silent',alt:33},ok:'hall_q',no:'hall_l',sub:'גנב: תנועה בדממה. אחרים: סיכוי של שליש'},{t:'לרדת בלי להסתתר',go:'hall_l'}]},
hall_q:{t:()=>`<p><b>המבואה.</b> מרתף גדול, עשרה על עשרה מטרים. רצפה של בוץ ושברי עץ. דלת עץ בקיר הדרומי, דלת נוספת בקיר המזרחי.</p><p>סביב שולחן מאולתר רוכנים שני יצורים בגובה מטר וקצת: עור ירוק כהה, שיניים מחודדות, שריון עור צבוע אדום־בורדו. הם מטילים קוביות מתוך סיר ומקללים. <b>הם עוד לא ראו אותך.</b></p>`,
 c:[{t:'לתקוף בהפתעה',fight:'gob1',surprise:1},{t:'לחמוק לאורך הקיר אל הדלת הדרומית',test:{k:'skill',s:'hide',alt:33},ok:'corrS',no:'hall_l',okfx:h=>{h.f.gobAlive=1;},nomsg:'קרש נשבר תחת רגלך.'},{t:'לצאת מהצל ולדבר',go:'talk'}]},
hall_l:{t:()=>`<p><b>המבואה.</b> מרתף גדול, עשרה על עשרה מטרים, רצפה של בוץ ושברי עץ. שני גובלינים קופצים ממקומם ליד שולחן מאולתר. עור ירוק כהה, שיניים מחודדות, שריון עור אדום־בורדו. הם שולפים חניתות קצרות.</p>`,c:[{t:'להילחם',fight:'gob1'},{t:'להרים יד ריקה ולדבר',go:'talk'}]},
talk:{t:()=>`<p>“אנחנו האדומים של טופאש!” צורח הגדול מבין השניים. “המגדל שלנו!”</p>`,c:[{t:'להציע שוחד',test:{k:'react',n:8},ok:'bribe',no:'talkbad'},{t:'להילחם',fight:'gob1'}]},
talkbad:{t:()=>`<p>הם מחליפים מבט, מגחכים, ומסתערים.</p>`,c:[{t:'להילחם',fight:'gob1'}]},
bribe:{t:()=>`<p>עיניים צהובות ננעצות בארנק. “עשרה מטבעות. ולא ראינו אותך. לא שמענו אותך.”</p>`,
 c:[{t:'לשלם 10 מטבעות כסף',if:h=>h.silver>=10,fx:h=>{h.silver-=10;h.f.paid=1;h.f.gobAlive=1;},go:'hall_paid'},{t:'לסרב ולשלוף נשק',fight:'gob1'}]},
hall_paid:{t:()=>`<p>המטבעות נעלמים בכיסים מזוהמים. הגובלינים חוזרים לקוביות שלהם, ומעמידים פנים שאינך שם.</p>`,c:[{t:'הדלת הדרומית',go:'corrS'},{t:'הדלת המזרחית',go:'corrE'}]},
hall:{t:()=>`<p><b>המבואה.</b> ${F('gob1')?'על השולחן מוטלים שרידי הקרב. ':''}מדפים רקובים, ואנקולים חלודים שתלו עליהם פעם בשר. דלת בקיר הדרומי, דלת בקיר המזרחי, ומדרגות העולות למעלה.</p>`,
 c:[{t:'לנוח מעט',if:h=>!h.f.rest1||h.diff==='story',rest:1},{t:'הדלת הדרומית',go:'corrS'},{t:'הדלת המזרחית',go:'corrE'},{t:'לעלות ולצאת מהמגדל',go:'leave'}]},
hall_win:{once:h=>{const s=R(4,6);h.silver+=s;h.items.rdagger=1;h.f.gob1=1;return 'אספת '+s+' מטבעות כסף.';},
 t:()=>`<p>על השולחן: מטבעות כסף, גופת דורבן שניצוד לא מזמן, ופגיון חלוד – אבל שמיש. בסיר יש קוביות עצם.</p>`,c:[{t:'להמשיך',go:'hall'}]},
corrS:{t:()=>`<p>מסדרון צר יורד דרומה. בקיר המערבי נפער כוך. מעט הלאה, בקיר המזרחי – דלת סגורה. מבעד לסדקיה בוקע אור כתום, וחום. בקצה המסדרון הרצפה נקטעת: <b>תהום</b>.</p>`,
 c:[{t:'לבחון את הכוך',go:'niche'},{t:'להצמיד אוזן לדלת',go:'listen',if:h=>!h.f.topash},{t:'לפרוץ את הדלת',fight:'topash',if:h=>!h.f.topash},{t:'חדרו של טופאש',go:'topash_room',if:h=>h.f.topash},{t:'אל התהום',go:'chasm'},{t:'בחזרה למבואה',go:'back_hall'}]},
back_hall:{route:h=>(h.f.gobAlive&&!h.f.paid&&!h.f.gob1)?'hall_l':(h.f.paid&&!h.f.gob1?'hall_paid':'hall')},
niche:{t:()=>`<p>הכוך עמוק שני מטרים וארוך ארבעה. בקיר חמש גומחות קטנות, ובכל אחת קערת נר ישנה מפליז. על הקיר רשומים מזמורים מן הדת העתיקה, לאל בעל חמשת הפנים ולמתנותיו לעולם. רובם נמחקו עם השנים.</p>`,
 c:[{t:'להדליק את חמשת הנרות',if:h=>!h.f.candles,go:'candle',fx:h=>{h.f.candles=1;}},{t:'בחזרה למסדרון',go:'corrS'}]},
candle:{route:h=>h.cls==='cleric'?'candle_c':'candle_ok'},
candle_c:{t:()=>`<p>הלהבות עולות כחולות. משהו במזמורים מזהה אותך – כוהן{|ת} של אל אחר. השרירים מתכווצים.</p>`,c:[{t:'לעמוד בכאב',test:{k:'save',i:2},ok:'candle_ok',no:'candle_bad'}]},
candle_ok:{once:h=>{h.f.bless=1;return 'ברכה: +2 להתקפות בקרב הבא.';},t:()=>`<p>להבות קטנות וכחלחלות. חום נעים עובר בגופך, כאילו מישהו מקשיב.</p>`,c:[{t:'בחזרה למסדרון',go:'corrS'}]},
candle_bad:{once:h=>{h.f.curse=1;return 'קללה: −2 להתקפה ולדרג״ש בכל הקומה הזאת.';},t:()=>`<p>הכאב לא עובר. הוא מתיישב בשרירים כמו אבן.</p>`,c:[{t:'בחזרה למסדרון',go:'corrS'}]},
listen:{once:h=>{h.f.ready=(h.f.gobFled||d(6)===1)?1:0;return '';},t:()=>`<p>חום עולה מבעד לסדקים. קול גס ממלמל מילים לכלב, בשפה שאינה של בני אדם. ${F('ready')?'<b>הנביחה נקטעת. הכלב הריח אותך.</b>':'הכלב נוחר בשלווה. אם תפרצ{|י} עכשיו – הוא לא יתעורר בזמן.'}</p>`,
 c:[{t:'לפרוץ פנימה',fight:'topash'},{t:'להתרחק',go:'corrS'}]},
topash_win:{once:h=>{const s=R(6,10),gg=R(1,6)*10;h.silver+=s;h.gold+=gg;h.f.topash=1;return 'בשק העור: '+s+' כסף ו־'+gg+' זהב.';},
 t:()=>`<p>חבית פח במרכז החדר, ובה גחלים. על שיפוד מעליה – בשר ציד מעלה עשן. מיטה של פרוות וכריות, ומולה מיטה קטנה של הכלב. מתחת למיטה הגדולה – שק עור ורובה קשת.</p>`,c:[{t:'להמשיך',go:'topash_room'}]},
topash_room:{t:()=>`<p>חדרו של טופאש. הגחלים עוד לוחשות, והחום טוב. מקום לנוח בו – אם מעזים.</p>`,c:[{t:'לנוח ליד הגחלים',if:h=>!h.f.rest1||h.diff==='story',rest:1},{t:'בחזרה למסדרון',go:'corrS'}]},
chasm:{t:()=>`<p>תהום. ארבעה מטרים עד הצד השני, שם ממשיך המסדרון, מכוסה אבק עבה. אין שריד לגשר – כנראה רעידת אדמה, לפני שנים. התהום נמשכת גם צפונה ודרומה.</p><p>כשמביטים מטה יש תחושה לא נעימה, כאילו משהו מביט חזרה. משהו שמעולם לא ראה אור יום.</p>`,
 c:[{t:'להשליך לפיד למטה',if:h=>h.items.torch>1,go:'abyss_look',fx:h=>{h.items.torch--;}},
  {t:'להשליך את הקרס אל זיז בצד השני',if:h=>has('rope')&&!h.f.hook,test:{k:'atk',ac:16},ok:'hooked',no:'chasm',nomsg:'הקרס נוקש באבן ונופל. אפשר לנסות שוב.'},
  {t:'לחצות על החבל',if:h=>h.f.hook,go:'hooked'},
  {t:'לטפס לאורך הקיר הסדוק',if:h=>h.cls==='thief',test:{k:'skill',s:'climb'},ok:'dust',no:'fall_free'},
  {t:'בחזרה למסדרון',go:'corrS'}]},
hooked:{once:h=>{h.f.hook=1;return '';},t:()=>`<p>הקרס נתפס בזיז בצד השני. החבל מתוח מעל האפלה. הזיז נראה חזק. אולי.</p>`,
 c:[{t:'לקשור את החבל גם למותניים ולחצות',test:{k:'pct',p:35},ok:'dust',no:'fall_tied',sub:'בטוח יותר אם הזיז יישבר'},{t:'לחצות מהר, ידיים בלבד',test:{k:'pct',p:35},ok:'dust',no:'fall_free'},{t:'לחזור',go:'corrS'}]},
fall_tied:{once:h=>{const x=R(1,6,2);hurt(x);h.f.hook=0;return 'הזיז נשבר. החבל עוצר אותך, והסלעים המשוננים פוצעים אותך: '+x+' נזק.';},
 t:()=>`<p>קול שבר יבש. הזיז נעקר. את{ה|} נופל{|ת} – והחבל נמתח בחבטה. את{ה|} תלוי{|ה} מעל האפלה, ומטפס{|ת} בחזרה למעלה, מדמם{|ת}.</p>`,c:[{t:'לנסות שוב',go:'chasm'}]},
fall_free:{once:h=>{const x=R(7,6);hurt(x);return 'נפילה של עשרים מטר: '+x+' נזק.';},t:()=>`<p>האחיזה נשמטת. עשרים מטרים של חושך. מים קרים בתחתית, ואבנים.</p>`,c:[{t:'להתרומם',go:'abyss'}]},
abyss_look:{t:()=>`<p>הלפיד נופל זמן רב מדי. רחוק למטה הוא פוגע במים וכבה. לרגע אחד: נצנוץ של אבני חן, ומשהו שנע בחלקלקות.</p>`,
 c:[{t:'לרדת בחבל אל הקרקעית',if:h=>has('rope'),test:{k:'ab',a:'dex',mod:4},ok:'abyss',no:'fall_tied'},{t:'לא, לחזור',go:'chasm'}]},
abyss:{t:()=>`<p>בוץ. בריכה שחורה. אבני חן מנצנצות בין הסלעים. ומעל, מסדק בקיר, נורה חוט דביק ולבן אל צווארך.</p>`,c:[{t:'להילחם',fight:'fisher'}]},
abyss_win:{once:h=>{h.treasure.push(['אבני חן מן התהום',50]);return 'אבני חן בשווי 500 כסף.';},t:()=>`<p>היצור צונח לבריכה. בין האבנים – חופן אבני חן, שוות לפחות חמש מאות מטבעות כסף. הטיפוס חזרה ארוך, ו{ידיך|ידייך} רועדות.</p>`,c:[{t:'לטפס בחזרה',go:'chasm'}]},
dust:{t:()=>`<p>הצד השני. אבק עבה, שלא נגעו בו שנים. המסדרון ממשיך, ובסופו דלת בצד המערבי. ערפל כתום וחלוש זולג מתחתיה בזרם דקיק.</p>`,c:[{t:'אל הדלת',go:'mist'}]},
corrE:{t:()=>`<p>המסדרון פונה מזרחה, ונשבר בעיקול חד. מעבר לעיקול – אור מהבהב, וריח של בשר חרוך.</p>`,
 c:[{t:'לחפש בקירות העיקול',if:h=>!h.f.secret,test:{k:'d6',n:1,thief:1,l:'חיפוש'},w:1,ok:'secret',no:'corrE',nomsg:'אבן, טיח, עובש. כלום.'},{t:'אל הדלת הסודית',if:h=>h.f.secret,go:'secret'},{t:'אל האור',go:'quarters',if:h=>!h.f.gob2},{t:'מגורי הגובלינים',go:'quarters_done',if:h=>h.f.gob2},{t:'בחזרה למבואה',go:'back_hall'}]},
quarters:{t:()=>`<p>חדר שישה על שישה, בלי יציאות. במרכזו חבית ובה אש. גובלין אחד פושט את עורה של ארנבת, השני מזין את האש בדפים מספר עתיק. מצעים של עשב יבש ושמיכות שורצות קרציות.</p><p>הם מבחינים בך וזועקים – ספק קריאת קרב, ספק זעקת אימה.</p>`,c:[{t:'להילחם',fight:'gob2'}]},
quarters_win:{once:h=>{const s=R(2,6);h.silver+=s;h.f.gob2=1;if(h.cls==='mu')h.f.learn=1;return 'בכיסיהם '+s+' כסף.';},t:()=>`<p>בין הגחלים – שרידי דפים חרוכים. בחינה מדוקדקת חושפת את שם בעלת הספר: <b>“רנאגה, הקוסמת מן העמק.”</b></p><p>${S.h.cls==='mu'?'לחש אחד שרד את האש. אפשר להעתיק אותו לספר שלך.':'הכתב צפוף ומוזר, ואינו אומר לך דבר.'}</p>`,
 c:[{t:'להעתיק את הלחש: מגן',if:h=>h.f.learn&&!h.spells.includes('shield'),fx:h=>{h.spells.push('shield');h.f.learn=0;},go:'quarters_done'},{t:'להעתיק את הלחש: אור',if:h=>h.f.learn&&!h.spells.includes('light'),fx:h=>{h.spells.push('light');h.f.learn=0;},go:'quarters_done'},{t:'להמשיך',if:h=>!h.f.learn,go:'quarters_done'}]},
quarters_done:{t:()=>`<p>האש גוססת. ריח של בשר חרוך ושל קרציות.</p>`,c:[{t:'בחזרה לעיקול',go:'corrE'}]},
secret:{once:h=>{h.f.secret=1;return '';},t:()=>`<p>סדק דק מדי בטיח, ישר מדי. דלת סודית. היא נתקעה מזמן.</p>`,
 c:[{t:'לדחוף בכתף',test:{k:'ab',a:'str',mod:-2},ok:'tunnel',no:'secret',nomsg:'הדלת לא זזה.'},{t:'לנפץ את הטיח בפטיש',if:h=>has('hammer'),go:'smash'},{t:'לעזוב',go:'corrE'}]},
smash:{route:h=>h.f.gob2?'tunnel':'smash_noise'},
smash_noise:{t:()=>`<p>הטיח מתפורר ברעש. מאחור נשמעות רגליים יחפות רצות. הגובלינים מן החדר שמעבר לעיקול באים לראות.</p>`,c:[{t:'להסתובב אליהם',fight:'gob2',win:'tunnel'}]},
tunnel:{t:()=>`<p>מחילה בגובה מטר, ואפשר רק לזחול. האבק סמיך, ומשהו דק מבריק באדמה ליד הקיר הימני.</p>`,
 c:[{t:'לחפש מלכודות',test:{k:'skill',s:'traps',alt:17},ok:'trap_seen',no:'trap',sub:'גנב: מציאת מלכודות. אחרים: 1 מ־6'},{t:'להמשיך לזחול',go:'trap'}]},
trap_seen:{t:()=>`<p>להב חלוד, מוסתר באדמה, מחובר לקפיץ ישן בקיר הימני. מספיק לא לגעת בקיר.</p>`,c:[{t:'לזחול בזהירות הלאה',go:'tunnel_end'}]},
trap:{once:h=>{if(d(6)>2)return 'נקישה עמומה. הקפיץ החלוד לא עבד.';const r=test({k:'save',i:3},h);if(r.ok)return r.txt+'. הלהב חותך את האוויר, סנטימטרים ממך.';const x=R(1,4,1);hurt(x);return r.txt+'. להב חלוד פורץ מן האדמה: '+x+' נזק.';},
 t:()=>`<p>ידך נשענת על הקיר הימני.</p>`,c:[{t:'להמשיך',go:'tunnel_end'}]},
tunnel_end:{t:()=>`<p>המחילה נגמרת בסוף מסדרון מאובק. בצד המערבי – דלת, וערפל כתום זולג מתחתיה.</p>`,c:[{t:'אל הדלת',go:'mist'}]},
mist:{t:()=>`<p>ערפל חלוש וכתום יוצא מסף הדלת. ריח של אדמה ישנה. קר כאן מדי לחודש הזה.</p>`,c:[{t:'לפתוח את הדלת',go:'guards',if:h=>!h.f.skel},{t:'אל השומרים שנפלו',go:'guards_done',if:h=>h.f.skel}]},
guards:{t:()=>`<p>מסדרון פונה מערבה, רוחבו ארבעה מטרים, ובסופו דלת אבן כפולה. האוויר מחניק. ערפל כתום דליל על הרצפה.</p><p>ליד הדלתות מביטים בך, בלי נשמה, שני שלדים בשריון שרשראות עתיק. בידיהם חרבות ארוכות ומגנים. בדממת המתים הם מתעוררים – ונעים לעברך.</p>`,c:[{t:'להילחם',fight:'skel'}]},
guards_done:{t:()=>`<p>ערימות עצמות ושריון חלוד. הדלת הכפולה נעולה. האוויר עוד מחניק.</p>`,
 c:[{t:'לחפש בערפל',if:h=>!h.items.key1,w:1,go:'key1'},{t:'לפתוח את הדלתות במפתח',if:h=>h.items.key1,go:'stairs2'},{t:'לפרוץ את המנעול',if:h=>h.cls==='thief'&&!h.items.key1,test:{k:'skill',s:'locks'},ok:'stairs2',no:'guards_done',nomsg:'המנעול עתיק ועקשן.'}]},
key1:{once:h=>{h.items.key1=1;return 'מפתח אבן כבד.';},t:()=>`<p>בתוך הערפל, על הרצפה: תיבה קטנה. בתוכה מפתח כבד, עשוי אבן.</p>`,c:[{t:'לפתוח את הדלת הכפולה',go:'stairs2'}]},
stairs2:{once:h=>{h.floor=2;h.f.curse=0;return '';},t:()=>`<p>מדרגות יורדות. משב רוח קל חולף על {פניך|פנייך}, ואור הלפיד רוקד. עם כל צעד ברור יותר: כאן קר יותר מאשר למעלה. האבק נדבק ללחות והפך לעיסה של בוץ דליל.</p><p><b>הקטקומבות.</b></p>`,c:[{t:'לרדת',go:'statue'}]},
statue:{t:()=>`<p>אולם קטן, שתים־עשרה על עשרה. לפיד אחד לא מספיק להאיר אותו. על הקירות ציורים גסים של גולגולות מחייכות, של גזעים שונים.</p><p>במרכז – פסל ברזל חלוד של אישה צעירה בגלימות. בידה הימנית מטה שבקצהו גולה, ובשמאלית – קערית. פניה כמעט נמחקו, אבל שפתיה עדיין אכזריות.</p><div class="quote">“מבורכת העיר שכל הקוסמים בה מתים, וארור הקבר בו הם נקברים – אך זאת תאמרו רק באפלה, כי האומץ ייגזל מכם במהרה.”</div>`,
 c:[{t:'להתעמק בכתובת',if:h=>!h.f.lore,test:{k:'ab',a:'int'},ok:'lore',no:'statue',nomsg:'המילים מוכרות, אבל הזיכרון לא מגיע.'},{t:'לחפש בפסל',if:h=>!h.f.orb,test:{k:'d6',n:2,thief:1,l:'חיפוש'},w:1,ok:'orb',no:'statue',nomsg:'ברזל קר וחלוד.'},
  {t:'לנוח מעט',if:h=>!h.f.rest2||h.diff==='story',rest:2},{t:'הדלת הרקובה במערב',go:'store'},{t:'הדלת המחוזקת בברזל',go:'corr2'}]},
lore:{once:h=>{h.f.lore=1;return '';},t:()=>`<p>החלק הראשון הוא פתגם עתיק, מהימים שבהם קוסמים נרדפו בערים הגדולות ונאלצו להימלט ולמצוא מקומות מסתור. הפסל הזה לא הוצב כאן לכבוד. הוא הוצב כאזהרה.</p>`,c:[{t:'להמשיך',go:'statue'}]},
orb:{t:()=>`<p>הגולה שבקצה המטה זזה מעט תחת {אצבעותיך|אצבעותייך}. אפשר להבריג אותה החוצה.</p>`,c:[{t:'להבריג',go:'orb2'},{t:'להשאיר',go:'statue'}]},
orb2:{once:h=>{h.f.orb=1;h.items.ldagger=1;h.zap=1;if(h.cls==='mu')return 'הגולה מזהה את הקסם שבך, ושותקת.';const r=test({k:'save',i:4},h),x=R(2,6),dm=r.ok?Math.ceil(x/2):x;hurt(dm);return r.txt+'. זיק ברק: '+dm+' נזק.';},
 t:()=>`<p>בתוך המטה החלול – פגיון ארוך ודק, ניצב כחול כהה מעוטר בסימני ברקים. <b>פגיון הברקים:</b> +1 להתקפה ולנזק, פוגע גם במה שנשק רגיל לא פוגע, ופעם ביום – זיק ברק של 2ק6.</p>`,c:[{t:'להמשיך',go:'statue'}]},
store:{t:()=>`<p>חדרון שישה על ארבעה. ריח העובש מכה בנחיריים. צנצנות שבורות ומשחות ישנות מעלות עובש בכל מקום. נראה שאין כאן כלום.</p>`,
 c:[{t:'לחפש בפינה הדרום־מערבית',if:h=>!h.f.bottle,go:'bottle'},{t:'לחפש עוד, בסבלנות',if:h=>!h.items.bkey,test:{k:'d6',n:2,l:'חיפוש'},w:1,ok:'bkey',no:'store',nomsg:'עובש, זכוכית, עובש.'},{t:'בחזרה לאולם הפסל',go:'statue'}]},
bottle:{once:h=>{h.f.bottle=1;h.treasure.push(['בקבוק בדולח',8]);return 'בקבוק בדולח: שווה 80 כסף.';},t:()=>`<p>בקבוק אחד שלם וריק, מוטל על צדו. בדולח מפותח ושיבוצים של זכוכית צבעונית. בעיר ישלמו עליו יפה.</p>`,c:[{t:'להמשיך',go:'store'}]},
bkey:{once:h=>{h.items.bkey=1;return 'מפתח ברזל קטן וכחול.';},t:()=>`<p>מתחת לערימת צנצנות – מפתח ברזל קטן, צבוע כחול.</p>`,c:[{t:'להמשיך',go:'store'}]},
corr2:{t:()=>`<p>מעבר לדלת המחוזקת – מסדרון. בצדו האחד דלת צבועה כחול דהוי. בצדו האחר – פתח רחב לאולם, וריח כבד של אדמה פתוחה.</p>`,
 c:[{t:'הדלת הכחולה',go:'bluedoor'},{t:'האולם',go:'sarc',if:h=>!h.f.zomb},{t:'אולם המתלמדים',go:'sarc_done',if:h=>h.f.zomb},{t:'בחזרה לאולם הפסל',go:'statue'}]},
bluedoor:{route:h=>h.f.poolOpen?'pool':'bluedoor2'},
bluedoor2:{t:()=>`<p>הדלת הכחולה נעולה.</p>`,c:[{t:'לפתוח במפתח הכחול',if:h=>h.items.bkey,go:'pool',fx:h=>{h.f.poolOpen=1;}},{t:'לפרוץ את המנעול',if:h=>h.cls==='thief',test:{k:'skill',s:'locks'},ok:'pool',no:'bluedoor2',okfx:h=>{h.f.poolOpen=1;},nomsg:'המנעול לא נכנע.'},{t:'לחזור',go:'corr2'}]},
pool:{t:()=>`<p>חלל עגול, קוטרו שישה מטרים. הרצפה חלקה מאוד, ושרידי פסיפס מחוק – פעם היו המרצפות צבועות כחול. אין יציאה נוספת. במרכז בריכה קטנה, מכוסה אזוב ואצות ולכלוך דוחה. מים שעמדו כאן יותר מדי שנים.</p>`,
 c:[{t:'לשתות מן המים',test:{k:'save',i:0,mod:3},ok:'drink_ok',no:'drink_bad'},{t:'למדוד את העומק במקל',if:h=>!h.f.chest,test:{k:'d6',n:2,l:'גישוש'},ok:'chest',no:'pool',nomsg:'מטר וחצי. בוצה דביקה בקרקעית. לא יותר.'},{t:'לחזור',go:'corr2'}]},
drink_ok:{once:h=>{h.f.slow=1;return 'כאבים חדים. התנועה איטית.';},t:()=>`<p>המים מרים כמו מרה. הקאות. כאבים. אבל את{ה|} חי{|ה}.</p>`,c:[{t:'להמשיך',go:'pool'}]},
drink_bad:{t:()=>`<p>הבחילה לא עוברת. חצי שעה של הקאות על רצפת הפסיפס הכחול, ואז שקט.</p>`,c:[],death:'מת{|ה} מן המים הרעים, בחדר הבריכה הכחולה.'},
chest:{t:()=>`<p>המקל נתקל במשהו קשה וישר בקרקעית: תיבת אבן. כבדה. המים הדוחים צורבים את העור.</p>`,
 c:[{t:'להרים בכוח הזרועות',test:{k:'ab',a:'str',mod:-4},ok:'chest2',no:'chest_hurt',sub:'צריך כוח רב'},{t:'לקשור בחבל ולגרור',if:h=>has('rope'),test:{k:'ab',a:'str'},ok:'chest2',no:'chest_hurt'},{t:'לעזוב',go:'pool'}]},
chest_hurt:{once:h=>{const r=test({k:'save',i:0},h);if(r.ok)return r.txt+'. התיבה לא זזה.';if(d(2)===1){const x=d(3);hurt(x);return r.txt+'. צריבה: '+x+' נזק.';}h.f.corroded=1;return r.txt+'. משהו במים אוכל את השריון: −1 לדרג״ש.';},t:()=>`<p>התיבה לא זזה, והמים עושים את שלהם.</p>`,c:[{t:'לנסות שוב',go:'chest'},{t:'לעזוב',go:'pool'}]},
chest2:{once:h=>{h.f.chest=1;h.silver+=260;h.items.brooch=1;h.brooch=1;h.items.breath=1;return '260 כסף, סיכה ושיקוי.';},t:()=>`<p>התיבה נפתחת בחריקה. בפנים: 260 מטבעות כסף. סיכה כסופה בצורת מטה – <b>סיכת הריפוי</b>, שמרפאת פעם ביום. ושיקוי כחול עז, בצבע של ברק – <b>נשיפת דרקון</b>. בתחתית: פירורים של קשקשים כחולים.</p>`,c:[{t:'להמשיך',go:'pool'}]},
sarc:{t:()=>`<p>אולם שמונה על שתים־עשרה. ארבעה ארונות קבורה מאבן. על כל אחד חרוטה כתובת דהויה, בת מאה שנים לפחות: שם מחוק של מתלמד באמנות הקסם, ומילות תודה לאל בעל חמשת הראשים.</p><p>אבן חורקת על אבן. שני מכסים זזים.</p>`,c:[{t:'להילחם',fight:'zomb'},{t:'לסגת',go:'corr2'}]},
sarc_done:{t:()=>`<p>האולם שקט שוב. ארבעה ארונות, שניים פתוחים.</p>`,c:[{t:'לחפש בארונות',if:h=>!h.f.books,w:1,go:'books'},{t:'למשוך בידית שבארון הרביעי',if:h=>h.f.books,go:'fake'},{t:'בחזרה למסדרון',go:'corr2'}]},
books:{once:h=>{h.f.books=1;let m='';if(d(100)<=15){if(d(100)<=(h.cls==='thief'||h.cls==='mu'?60:30)){h.treasure.push(['ספר לחשים של מתלמד',100]);m='ספר לחשים אחד שרד, והצלחת להרים אותו בלי שיתפורר. שוויו 100 זהב.';}else m='ספר אחד שרד – ומתפורר ב{ידיך|ידייך}.';}else m='הספרים הפכו מזמן לאבק.';return m;},
 t:()=>`<p>בכל ארון – שרידים של ספר לחשים. ובארון הרביעי, בין העצמות, ידית ברזל קטנה, שלא במקומה.</p>`,c:[{t:'למשוך בידית',go:'fake'},{t:'לא עכשיו',go:'sarc_done'}]},
fake:{t:()=>`<p>קיר זז בגניחה. חדר שמונה על שמונה. במרכזו ארון קבורה מפואר: אבן חן בכל אחד מארבעת צדדיו, ואחת על המכסה. בפנים – שלד שאינו קם, אוחז ספר לחשים מתפורר.</p><p>הכול כאן נועד ליצור רושם: זהו אולם הקבורה האחרון.</p>`,
 c:[{t:'לשלוף את חמש האבנים',if:h=>!h.items.gems5&&!h.f.gemsUsed,go:'fake',fx:h=>{h.items.gems5=1;}},{t:'לנקות את האבק מהקיר הצפוני',if:h=>!h.f.rune,go:'rune'},{t:'אל הרונה',if:h=>h.f.rune,go:'rune'},{t:'לחזור',go:'sarc_done'}]},
rune:{once:h=>{h.f.rune=1;return '';},t:()=>`<p>מתחת לאבק – רונה מצוירת על הקיר, בחמישה צבעים. הצבעים של חמש האבנים שבארון.</p>`,
 c:[{t:'להעביר את אור הלפיד דרך האבנים אל הרונה',if:h=>h.items.gems5,go:'sand',fx:h=>{h.treasure.push(['חמש אבני חן',7]);h.items.gems5=0;h.f.gemsUsed=1;}},{t:'לנפץ את האבנים ולחרוט ברסיסיהן את הרונה',if:h=>h.items.gems5,go:'sand',fx:h=>{h.items.gems5=0;h.f.gemsUsed=1;}},{t:'לדחוף את הקיר',go:'rune2'},{t:'לחזור',go:'fake'}]},
rune2:{t:()=>`<p>הקיר לא זז. הרונה מחכה.</p>`,c:[{t:'לחזור',go:'rune'}]},
sand:{t:()=>`<p>הקיר נפתח בלי קול. מסדרון ארוך, ובאמצעו ערימת חול, כמעט עד התקרה.</p>`,
 c:[{t:'לטפס מעל הערימה',go:'snake'},{t:'לפנות חול בזהירות לאורך הקיר',test:{k:'ab',a:'dex'},ok:'snake_quiet',no:'snake'}]},
snake:{once:h=>{const v=d(20)+2;if(v<AC(h))return 'ק20 = '+(v-2)+' +2 מול '+AC(h)+': הנחש מחטיא.';const x=d(4);hurt(x);const r=test({k:'save',i:0},h);if(!r.ok){const y=d(6);hurt(y);return 'נשיכה: '+x+' נזק. '+r.txt+': הארס צורב, עוד '+y+' נזק.';}return 'נשיכה: '+x+' נזק. '+r.txt+'.';},
 t:()=>`<p>החול זז. נחש יוצא מתוכו, מהיר כמו שוט, ובורח – לא לפני שהוא מנסה להכיש את מי שעומד בדרכו.</p>`,c:[{t:'להמשיך',go:'tomb'}]},
snake_quiet:{t:()=>`<p>החול זורם. משהו נע בתוכו, ונעלם לתוך חור בקיר. את{ה|} עובר{|ת}.</p>`,c:[{t:'להמשיך',go:'tomb'}]},
tomb:{t:()=>`<p>הדלת נפתחת לאולם מקפיא. עשרה על שישה. בקיר הצפוני דלת אבן. במרכז – קבר אחד.</p><p>רחש עולה מתוך הקבר. לא גרירה של זומבי, אלא משהו שנאבק לפרוץ החוצה, מלא זעם ושנאה לחיים, כי מנוחתו הופרה. המכסה רועד.</p>`,
 c:[{t:'לעמוד מול הקבר ולחכות',fight:'wight'},{t:'לרוץ אל דלת האבן הצפונית',test:{k:'d6',n:3,l:'מהירות'},ok:'treasure_first',no:'tomb_open'},{t:'לברוח אל אור היום',go:'flee_end'}]},
tomb_open:{t:()=>`<p>המכסה נזרק הצידה לפני שאת{ה|} מגיע{|ה} לדלת. דמות דקה מזדקפת: עור כקלף, עיניים כגחלים קרות, גלימות של קוסמת. רנאגאיסה.</p>`,c:[{t:'להילחם',fight:'wight'}]},
treasure_first:{t:()=>`<p>הדלת הצפונית נפתחת. {מאחוריך|מאחורייך}, המכסה מתנפץ על הרצפה. אין זמן – רק לסגור את דלת האבן ולהתכונן.</p><p>לרגע: שקט. ואז ציפורניים על אבן.</p>`,c:[{t:'להסתובב ולהילחם',fight:'wight',first:1}]},
tomb_win:{once:h=>{h.f.wight=1;let m='';if(d(100)<=15){if(d(100)<=30){h.treasure.push(['ספר הלחשים של רנאגאיסה',300]);m='ספר הלחשים של הקוסמת שרד: לחשים מעוצמה 3 ו־4. שווה הון.';}else m='ספר הלחשים של הקוסמת מתפורר בין {אצבעותיך|אצבעותייך}.';}else m='בקבר רק אבק וגלימות.';return m;},
 t:()=>`<p>הגוף הדק קורס. הקור נסוג מן האולם, לאט, כמו נשימה שיוצאת.</p>`,c:[{t:'אל דלת האבן הצפונית',go:'treasure'}]},
treasure:{t:()=>`<p>חדר קטן, ארבעה על שישה. פירורי חול רבים על הרצפה. שלוש תיבות בפינה: אחת צרה וארוכה, שתיים מלבניות. מולן – מכסה ברזל עבה, חצי מטר לפחות.</p>`,

 if(c.fight)return startFight(c.fight,{surprise:c.surprise,first:c.first,win:c.win});
 if(c.test){const r=test(c.test,h);S.roll=r.txt;S.lastTest={c:S.page,i:S.cur.indexOf(c)};S.canLuck=!r.ok&&h.luck>0;

 if(v<=need&&!S.god){const list=WANDER[h.floor][d(4)-1];S.note=(S.note?S.note+' ':'')+'רחש באפלה (ק6 = '+v+'): משהו מצא אותך.';return startFight(list,{win:to});}

 S.page=L.c;const node=N[L.c];S.cur=node.c.filter(x=>!x.if||x.if(S.h));const c=S.cur[L.i];S.roll='';

function sheet(){
 const el=$('sheet'),h=S&&S.h;
 if(!h||S.page==='__cover'){el.hidden=true;$('wrap').classList.add('solo');return;}
 el.hidden=false;$('wrap').classList.remove('solo');
 const it=[];const I=h.items;
 if(I.torch)it.push('לפידים ×'+I.torch);if(I.potion)it.push('שיקוי ריפוי ×'+I.potion);if(I.rope)it.push('חבל וקרס טיפוס');if(I.holy)it.push('מים קדושים ×'+I.holy);if(I.oil)it.push('שמן ×'+I.oil);if(I.hammer)it.push('פטיש ויתדות');if(I.tools)it.push('כלי גנב');
 if(I.rdagger)it.push('פגיון חלוד');if(I.ldagger)it.push('פגיון הברקים +1'+(h.zap?' (זיק מוכן)':''));if(I.key1)it.push('מפתח אבן');if(I.bkey)it.push('מפתח כחול');if(I.brooch)it.push('סיכת הריפוי'+(h.brooch?' (מוכנה)':''));if(I.breath)it.push('שיקוי נשיפת דרקון');if(I.gems5)it.push('חמש אבני חן');if(I.staff)it.push('מטה הקוסמת');if(I.ring)it.push('טבעת הגנה +1');if(I.cloak)it.push('גלימת הגנה +1');
 h.treasure.forEach(t=>it.push(t[0]));
 el.innerHTML=`<h3>${esc(h.name)}</h3><p class="who">${clsName(h)} · דרגה ${h.lvl||1} · קומה ${h.floor} · ${DIFF[h.diff||'classic']}</p>
 <div class="stat"><span>נקודות פגיעה</span><span><b>${Math.max(0,h.hp)}</b> / ${h.max}</span></div><div class="bar"><i style="width:${Math.max(0,h.hp)/Math.max(1,h.max)*100}%"></i></div>
 <div class="stat"><span>דרג״ש</span><span>${AC(h)}</span></div>
 <div class="stat"><span>נשק</span><span>${weapon(h).n} (ק${weapon(h).die}${weapon(h).plus?' +1':''})</span></div>
 <div class="stat"><span>מזל</span><span class="dots">${'<i class="on"></i>'.repeat(h.luck)}</span></div>
 ${h.cls==='mu'?`<div class="stat"><span>לחשים</span><span>${h.spells.map(s=>SPELLS[s]).join(', ')} · ${h.slots?h.slots+' מוכנים':'נוצלו'}</span></div>`:''}
 <div class="stat"><span>כסף / זהב</span><span>${h.silver} / ${h.gold}</span></div>
 <div class="more"><div class="stat"><span>הצלות</span><span style="font-size:13px">${CL[h.cls].sv.join(' · ')}</span></div>
 <div class="stat" style="flex-wrap:wrap;gap:2px 10px"><span>תכונות</span><span style="font-size:13.5px">${AB.map(a=>a[1]+' '+h.ab[a[0]]).join(' · ')}</span></div></div>
 <ul>${it.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>
 ${S.god?`<div class="stat" style="color:#efc46a"><span>✦ מצב בוחן</span><span><select id="gJump" style="font:inherit;font-size:14px;background:#2a2010;color:#efc46a;border:1px solid #5a4723;max-width:140px"><option value="">קפיצה לעמוד…</option>${Object.keys(N).filter(k=>N[k].t).map(k=>'<option>'+k+'</option>').join('')}</select></span></div>`:''}
 <div class="tools"><button id="tFold">${el.classList.contains('fold')?'הצג':'קפל'}</button><button id="tNew">התחלה מחדש</button></div>`;
 if($('gJump'))$('gJump').onchange=e=>{const v=e.target.value;if(v){S.h.hp=S.h.max;if(['statue','store','corr2','pool','sarc','sarc_done','fake','rune','sand','tomb','treasure'].includes(v))S.h.floor=2;go(v);}};
 $('tFold').onclick=()=>{el.classList.toggle('fold');sheet();};
 $('tNew').onclick=()=>{if($('tNew').dataset.sure){try{localStorage.removeItem(KEY);}catch(e){}S=null;render();}else{$('tNew').dataset.sure=1;$('tNew').textContent='בטוח? שוב לאישור';}};
}
function pageWrap(inner,no){return `<article class="page">${no?'<span class="pno">עמוד '+no+'</span>':''}${inner}${no?'<div class="foot">— '+no+' —</div>':''}</article>`;}
function render(){
 const m=$('main');
 if(!S||S.page==='__cover'){m.innerHTML=coverHTML();bindCover();sheet();return;}
 if(S.page==='__create'){m.innerHTML=pageWrap(createHTML(),0);bindCreate();sheet();return;}
 if(S.page==='__dead'){m.innerHTML=pageWrap(`<h2>הסוף</h2><div class="txt"><p>${esc(S.h.name)} ${esc(S.dead)}</p><p>המגדל שותק שוב. הטחב יכסה גם את זה.</p></div>${S.roll?'<p class="roll">'+S.roll+'</p>':''}<ul class="choices"><li><button id="again">לפתוח את הספר מחדש</button></li></ul>`,'†');$('again').onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}S=null;render();};sheet();return;}
 if(S.page==='__fight'){m.innerHTML=pageWrap(fightHTML(),S.pno.__f||'⚔');bindFight();sheet();return;}
 const node=N[S.page],h=S.h;const cs=(node.c||[]).filter(c=>!c.if||c.if(h));S.cur=cs;
 if(node.death)return die(g(node.death));
 const head=(S.roll?`<p class="roll"><span class="dieanim">⚄</span> ${S.roll}${S.note?' · '+g(S.note):''}</p>`:(S.note?`<p class="roll">${g(S.note)}</p>`:''));
 const luck=(S.canLuck&&S.lastTest&&h.luck>0&&S.roll)?`<button class="luck" id="luckB">להשתמש בנקודת מזל ולגלגל שוב (נשארו ${h.luck})</button>`:'';
 m.innerHTML=pageWrap(`${head}${luck}<div class="txt">${g(node.t())}</div><ul class="choices">${cs.map((c,i)=>`<li><button data-i="${i}"><span>${g(c.t)}${c.sub?'<span class="t">'+g(c.sub)+'</span>':''}</span><span class="go">${c.fight?'לקרב':c.rest?'מנוחה':''}</span></button></li>`).join('')}${node.end?'<li><button id="again2">לפתוח את הספר מחדש</button></li>':''}</ul>`,S.pno[S.page]);
 cs.forEach(c=>{if(c.go&&!S.pno[c.go])S.pno[c.go]=nextNo();if(c.ok&&!S.pno[c.ok])S.pno[c.ok]=nextNo();});
 m.querySelectorAll('.choices button[data-i]').forEach(b=>{const c=cs[+b.dataset.i];b.querySelector('.go').textContent=c.fight?'לקרב':c.rest?'מנוחה':'';b.onclick=()=>{S.canLuck=false;choose(c);};});
 if($('luckB'))$('luckB').onclick=useLuck;
 if($('again2'))$('again2').onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}S=null;render();};
 save();sheet();
}
function fightHTML(){
 const F=S.fight,h=S.h;if(!alive().includes(F.foes[F.sel]))F.sel=F.foes.indexOf(alive()[0]);
 const und=alive().some(f=>f.und),acts=[`<button data-a="atk">התקפה</button>`];
 if(h.cls==='mu'&&h.slots>0)h.spells.forEach(s=>acts.push(`<button data-a="spell" data-x="${s}">${SPELLS[s]}</button>`));
 if(h.cls==='thief'&&!F.hidden)acts.push(`<button data-a="hide">להיבלע בצללים</button>`);
 if(h.cls==='cleric'&&und&&!F.turned)acts.push(`<button data-a="turn">גירוש אל־מתים</button>`);
 if(h.zap)acts.push(`<button data-a="zap" class="sec">זיק ברק</button>`);
 if(h.items.oil)acts.push(`<button data-a="oil" class="sec">לזרוק שמן (${h.items.oil})</button>`);
 if(h.items.holy&&und)acts.push(`<button data-a="holy" class="sec">מים קדושים</button>`);
 if(h.items.breath)acts.push(`<button data-a="breath" class="sec">נשיפת דרקון</button>`);
 if(h.cure&&h.hp<h.max)acts.push(`<button data-a="cure">ריפוי פצעים קלים</button>`);
 if(h.items.potion&&h.hp<h.max)acts.push(`<button data-a="potion" class="sec">שיקוי ריפוי (${h.items.potion})</button>`);
 if(h.brooch&&h.hp<h.max)acts.push(`<button data-a="brooch" class="sec">סיכת הריפוי</button>`);
 if(F.flee)acts.push(`<button data-a="flee" class="sec">לברוח</button>`);
 return `<h2>קרב · סבב ${F.round}</h2>
 <div class="fight" role="group" aria-label="אויבים">${F.foes.map((f,i)=>`<div class="foe${(f.hp<=0||f.gone)?' out':''}" data-f="${i}" aria-selected="${i===F.sel&&f.hp>0&&!f.gone}"><div><b>${esc(f.n)}</b> <small>דרג״ש ${f.ac}${f.asleep?' · ישן':''}${f.und?' · מת מהלך':''}${f.magic?' · רק קסם פוגע בו':''}${f.fled?' · ברח':f.gone?' · נסוג':''}</small></div><div class="hp"><i style="width:${Math.max(0,f.hp)/f.max*100}%"></i></div></div>`).join('')}
 <div class="acts">${acts.join('')}</div><ul class="flog">${F.log.slice(0,12).map(l=>'<li'+(l.includes('class="hit"')?' class="hit"':'')+'>'+g(l)+'</li>').join('')}</ul></div>
 <p class="roll" style="margin-top:12px">לחצו על אויב כדי לבחור במי לפגוע. דרג״ש שלך: ${S.fight.shield?Math.max(17,AC(h)):AC(h)} · נק״פ ${Math.max(0,h.hp)}/${h.max}</p>`;
}
function bindFight(){
 document.querySelectorAll('.foe').forEach(e=>e.onclick=()=>{const f=S.fight.foes[+e.dataset.f];if(f.hp>0&&!f.gone){S.fight.sel=+e.dataset.f;render();}});
 document.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='flee')return fleeFight();heroAct(a,b.dataset.x);});
}

/* יצירת דמות */
let CR=null;
function rollAb(){const o={};AB.forEach(a=>o[a[0]]=R(3,6));return o;}
function createHTML(){
 if(!CR)CR={cls:'fighter',g:'m',ab:rollAb(),name:'',extra:'rope',spell:'sleep',rolls:2,diff:'classic'};
 const S0={h:{g:CR.g}};const gg=t=>String(t).replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(m,a,b)=>CR.g==='f'?b:a);
 const pv=newHero(CR.cls,CR.ab,'',CR.g,CR.extra,'',CR.diff),hp=pv.max,ac=AC(pv);
 return `<h2>מי יורד למגדל?</h2>
 <div class="row"><label>שם <input type="text" id="cName" value="${esc(CR.name)}" placeholder="${CR.g==='f'?'אלינור':'אלדריק'}" maxlength="24"></label>
 <span class="seg"><button data-g="m" aria-pressed="${CR.g==='m'}">גיבור</button><button data-g="f" aria-pressed="${CR.g==='f'}">גיבורה</button></span></div>
 <div class="grid4">${Object.keys(CL).map(k=>`<button class="cls" data-c="${k}" aria-pressed="${CR.cls===k}"><b>${CR.g==='f'?CL[k].nf:CL[k].n}</b><small>${gg(CL[k].blurb)}</small></button>`).join('')}</div>
 <p style="margin:0">תכונות (3ק6, לפי הסדר):</p>
 <div class="abil">${AB.map(a=>`<div><span>${a[1]}</span><b>${CR.ab[a[0]]}</b></div>`).join('')}</div>
 <div class="row"><button class="big alt" id="reroll" style="color:var(--ink);border-color:var(--ink)" ${CR.rolls?'':'disabled'}>לגלגל מחדש (${CR.rolls})</button>
 <span>נקודות פגיעה <b>${hp}</b> · דרג״ש <b>${ac}</b> · מזל <b>${pv.luck}</b> · דרגה <b>${pv.lvl}</b></span></div>
 <p style="margin:12px 0 4px">רמת קושי:</p><div class="seg"><button data-d="classic" aria-pressed="${CR.diff==='classic'}">קלאסי</button><button data-d="hard" aria-pressed="${CR.diff==='hard'}">קשוח</button></div>
 <p class="roll" style="margin:6px 0 0">${{classic:'התאמות לגיבור יחיד: נקודות פגיעה מוגדלות, +1 להתקפה. כל הגיבורים מתחילים בדרגה 2.',hard:'כמו בספר: דרגה 1, נקודות פגיעה רגילות, בלי הקלות.'}[CR.diff]}</p>
 <p style="margin:12px 0 4px">ציוד: לפידים, מימייה, מזון${CR.cls==='thief'?', כלי גנב':''}. ועוד דבר אחד:</p>
 <div class="seg">${Object.keys(EXTRA).map(k=>`<button data-x="${k}" aria-pressed="${CR.extra===k}">${EXTRA[k]}</button>`).join('')}</div>
 ${CR.cls==='mu'?`<p style="margin:12px 0 4px">בספר הלחשים: שינה, קליע קסם${CR.diff==='hard'?'':', מגן'}.</p>`:''}
 <p class="roll" style="margin-top:14px">כללים: ק20 + תוסף ≥ דרג״ש כדי לפגוע. הצלה: ק20 ≥ המספר. בכל כישלון אפשר לשרוף נקודת מזל ולגלגל שוב, ואם מכה הייתה הורגת – המזל משאיר נקודת פגיעה אחת.</p>
 <ul class="choices"><li><button id="begin"><span>לצאת אל הכפר שלמרגלות הגבעה</span></button></li></ul>`;
}
function bindCreate(){
 const rr=()=>{CR.name=$('cName').value;render();};
 $('cName').oninput=()=>{CR.name=$('cName').value;};
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{CR.g=b.dataset.g;rr();});
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{CR.cls=b.dataset.c;rr();});
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{CR.extra=b.dataset.x;rr();});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{CR.diff=b.dataset.d;rr();});
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{CR.spell=b.dataset.s;rr();});
 $('reroll').onclick=()=>{if(CR.rolls>0){CR.rolls--;CR.ab=rollAb();rr();}};
 $('begin').onclick=()=>{CR.name=$('cName').value.trim();S.h=newHero(CR.cls,CR.ab,CR.name,CR.g,CR.extra,CR.spell,CR.diff);CR=null;S.pno.village=2;go('village');};
}
N.create={route:()=>{S.page='__create';return null;}};
const _go=go;
go=function(id){if(id==='create'){S.page='__create';save();render();return;}return _go(id);};
if(innerWidth<900)$('sheet').classList.add('fold');
window.__g=()=>S;window.__t={newHero,startFight,heroAct,rollAb,setS:x=>{S=x;}};
let kb='',taps=0,tapT=0;
function toggleGod(){if(!S||!S.h)return;S.god=!S.god;S.note=S.god?'✦':'';save();render();}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;kb=(kb+(e.key||'')).slice(-5).toLowerCase();if(kb==='tamir'||kb==='אשצןר'){kb='';toggleGod();}});
document.addEventListener('click',e=>{if(!e.target.closest('.pno'))return;const t=Date.now();taps=(t-tapT<700)?taps+1:1;tapT=t;if(taps>=5){taps=0;toggleGod();}});
S=load();if(S&&S.page==='__fight'&&!S.fight)S.page='intro';
if(!S)S=null;render();
}
</script>
